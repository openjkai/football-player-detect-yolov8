<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Football Player Detection Dashboard{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Socket.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    
    <style>
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            margin: 0.2rem 0;
            transition: all 0.3s ease;
        }
        
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: white;
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }
        
        .main-content {
            background-color: #f8f9fa;
            min-height: 100vh;
        }
        
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            transition: all 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        
        .status-processing { background-color: #ffc107; }
        .status-completed { background-color: #28a745; }
        .status-failed { background-color: #dc3545; }
        .status-pending { background-color: #6c757d; }
        
        .progress-ring {
            width: 60px;
            height: 60px;
        }
        
        .progress-ring-circle {
            stroke: #e9ecef;
            stroke-width: 4;
            fill: transparent;
            r: 26;
            cx: 30;
            cy: 30;
        }
        
        .progress-ring-progress {
            stroke: #007bff;
            stroke-width: 4;
            stroke-linecap: round;
            fill: transparent;
            r: 26;
            cx: 30;
            cy: 30;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dasharray 0.3s ease;
        }
        
        .metric-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .upload-zone {
            border: 2px dashed #dee2e6;
            border-radius: 15px;
            padding: 3rem;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: #007bff;
            background-color: rgba(0, 123, 255, 0.05);
        }
        
        .file-item {
            background: white;
            border-radius: 10px;
            padding: 1rem;
            margin: 0.5rem 0;
            border-left: 4px solid #007bff;
        }
        
        .navbar-brand {
            font-weight: bold;
            color: #667eea !important;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-futbol me-2"></i>
                Football Player Detection
            </a>
            
            <div class="navbar-nav ms-auto">
                <div class="nav-item">
                    <span class="nav-link" id="system-status">
                        <span class="status-indicator status-completed"></span>
                        System Ready
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar p-0">
                <div class="p-3">
                    <h5 class="text-center mb-4">
                        <i class="fas fa-tachometer-alt me-2"></i>
                        Dashboard
                    </h5>
                    
                    <nav class="nav flex-column">
                        <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}" href="/">
                            <i class="fas fa-home me-2"></i>
                            Overview
                        </a>
                        <a class="nav-link {% if request.endpoint == 'upload_page' %}active{% endif %}" href="/upload">
                            <i class="fas fa-cloud-upload-alt me-2"></i>
                            Upload Files
                        </a>
                        <a class="nav-link {% if request.endpoint == 'history_page' %}active{% endif %}" href="/history">
                            <i class="fas fa-history me-2"></i>
                            Processing History
                        </a>
                        <a class="nav-link {% if request.endpoint == 'analytics_page' %}active{% endif %}" href="/analytics">
                            <i class="fas fa-chart-bar me-2"></i>
                            Analytics
                        </a>
                    </nav>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 main-content p-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Socket.IO Connection -->
    <script>
        const socket = io();
        
        // Handle status updates
        socket.on('status_update', function(status) {
            updateSystemStatus(status);
        });
        
        function updateSystemStatus(status) {
            const statusElement = document.getElementById('system-status');
            if (status.is_processing) {
                statusElement.innerHTML = `
                    <span class="status-indicator status-processing"></span>
                    Processing ${status.current_file || 'files'}...
                `;
            } else {
                statusElement.innerHTML = `
                    <span class="status-indicator status-completed"></span>
                    System Ready
                `;
            }
        }
        
        // Request initial status
        socket.emit('request_status');
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
